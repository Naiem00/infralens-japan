name: CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify backend
        run: npm run verify

      - name: Verify assessment API
        run: node scripts/verifyAssessmentApi.mjs

      - name: Verify authentication
        run: node scripts/verifyAuth.mjs

      - name: Verify saved architectures
        run: node scripts/verifySavedArchitectures.mjs

  frontend:
    name: Frontend verification
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify assessment engine
        run: node scripts/verifyAssessment.mjs

      - name: Verify recommendations
        run: node scripts/verifyRecommendations.mjs

      - name: Verify visualization
        run: node scripts/verifyVisualization.mjs

      - name: Verify failure simulator
        run: node scripts/verifyFailureSimulator.mjs

      - name: Verify service comparison
        run: node scripts/verifyServiceCompare.mjs

      - name: Verify cost calculator
        run: node scripts/verifyCostCalculator.mjs

      - name: Verify API integration
        run: node scripts/verifyApiIntegration.mjs

      - name: Build frontend
        run: npm run build

  terraform:
    name: Terraform validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra/terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.4

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate
